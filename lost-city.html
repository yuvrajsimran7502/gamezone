<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LOST CITY | RIO X GAMES</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07111b;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;pointer-events:none}
.row{display:flex;justify-content:space-between;gap:8px}
.panel{background:#101923eF;border:1px solid #00dfff88;padding:10px;border-radius:12px;font-size:12px}
#brand{color:#00eaff;font-weight:bold;letter-spacing:2px}
#healthbar{width:130px;height:8px;background:#492222;border-radius:10px;margin-top:5px}
#healthfill{height:100%;width:100%;background:#20e58b;border-radius:10px}
#mission{position:fixed;top:100px;left:10px;background:#111b26dd;padding:9px;border-radius:8px;font-size:11px;z-index:5}
#inventory{position:fixed;top:145px;left:10px;width:150px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;z-index:5}
.weapon{background:#14212ce8;border:1px solid #00dfff66;color:white;padding:8px 3px;border-radius:8px;font-size:10px}
.weapon.active{border:2px solid #00eaff;color:#00eaff}
#controls{position:fixed;bottom:20px;left:15px;right:15px;z-index:6;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#joy{width:105px;height:105px;border:2px solid #00dfff88;background:#ffffff16;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}
#stick{width:40px;height:40px;background:#00dfffbb;border-radius:50%;position:absolute;left:31px;top:31px}
.actions{display:grid;grid-template-columns:repeat(2,65px);gap:8px;pointer-events:auto}
.actions button{height:48px;border-radius:12px;background:#172a38;border:1px solid #00dfff99;color:white;font-weight:bold;font-size:10px;touch-action:none}
#look{width:75px;height:75px;border:2px solid #a65cff88;border-radius:50%;background:#a65cff22;position:fixed;right:15px;bottom:145px;z-index:6;touch-action:none}
#start{position:fixed;inset:0;z-index:10;background:linear-gradient(#050a12eF,#101b2bee);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#start h1{font-size:43px;color:#00eaff;text-shadow:0 0 20px #00dfff}
#start button{padding:15px 35px;background:#00dfff;border:0;border-radius:30px;font-weight:bold;font-size:16px}
#message{position:fixed;top:45%;width:100%;text-align:center;font-size:20px;color:#00eaff;z-index:8;pointer-events:none}
#hint{position:fixed;bottom:4px;width:100%;text-align:center;color:#aab;font-size:10px;z-index:5;pointer-events:none}
</style>
</head>
<body>

<div id="hud">
 <div class="row">
  <div class="panel">
   <span id="brand">RIO X GAMES</span><br>LOST CITY: OPEN WORLD
   <div>❤️ HEALTH <b id="health">100</b>/100</div>
   <div id="healthbar"><div id="healthfill"></div></div>
  </div>
  <div class="panel">
   💎 CRYSTALS: <b id="score">0/5</b><br>
   👾 ZOMBIES: <b id="enemycount">0</b><br>
   🌙 NIGHT MODE
  </div>
 </div>
</div>

<div id="mission">MISSION: Explore the village</div>

<div id="inventory">
 <button class="weapon active" data-id="1">1. Blaster</button>
 <button class="weapon" data-id="2">2. Pulse</button>
 <button class="weapon" data-id="3">3. Scope</button>
 <button class="weapon" data-id="4">4. Orb</button>
 <button class="weapon" data-id="5">5. Sword</button>
 <button class="weapon" data-id="6">6. Plasma</button>
</div>

<div id="start">
 <div>
  <h1>LOST CITY</h1>
  <h3>OPEN WORLD SURVIVAL</h3>
  <p>Explore a forgotten village.</p>
  <p>Discover wildlife and collect crystals.</p>
  <button id="play">START GAME</button>
  <p style="font-size:11px;color:#aaa">RIO X GAMES ORIGINAL</p>
 </div>
</div>

<div id="message"></div>

<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <div class="actions">
  <button id="action">ACTION</button>
  <button id="run">RUN</button>
 </div>
</div>
<div id="look"></div>
<div id="hint">WASD MOVE | 1-6 SELECT | SPACE ACTION</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

// WORLD
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101b2b);
scene.fog=new THREE.FogExp2(0x101b2b,.006);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,350);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x91b9e5,0x383020,1.5));

const moon=new THREE.DirectionalLight(0xc2d9ff,2);
moon.position.set(-30,60,30);
moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-100;
moon.shadow.camera.right=100;
moon.shadow.camera.top=100;
moon.shadow.camera.bottom=-100;
scene.add(moon);

const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});

const M={
 grass:mat(0x344b32),house:mat(0x78604b),
 roof:mat(0x343332),wood:mat(0x533a27),
 leaf:mat(0x1b492b),leaf2:mat(0x315d35),
 trunk:mat(0x513522),road:mat(0x39362f),
 stone:mat(0x74776e),skin:mat(0xc58d68),
 shirt:mat(0x253e63),pants:mat(0x202c36),
 dark:mat(0x25201d)
};

function box(w,h,d,m,x,y,z,parent=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(260,260),M.grass
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.2;
ground.receiveShadow=true;
scene.add(ground);

// ROADS
function road(x,z,w,d){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M.road);
 o.rotation.x=-Math.PI/2;
 o.position.set(x,.01,z);
 scene.add(o);
}
road(0,0,13,240);
road(0,0,240,13);

// HOUSES
const obstacles=[];
function house(x,z,id){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 const w=9+(id%3),d=8,h=5+(id%2);

 box(w,h,d,M.house,0,h/2,0,g);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(w*.8,4,4),M.roof
 );
 roof.position.y=h+1.5;
 roof.rotation.y=Math.PI/4;
 roof.castShadow=true;
 g.add(roof);

 box(1.5,2.8,.2,M.wood,0,1.4,d/2+.1,g);

 const windowMat=new THREE.MeshStandardMaterial({
  color:0x6ed8ed,emissive:0x165a70,emissiveIntensity:.7
 });

 for(const s of [-1,1]){
  box(1.7,1.5,.15,windowMat,s*2.7,2.8,d/2+.1,g);
  box(.08,1.6,.2,M.wood,s*2.7,2.8,d/2+.2,g);
  box(1.8,.1,.2,M.wood,s*2.7,2.8,d/2+.2,g);
 }
 box(1,2,1,M.wood,w*.25,h+2,0,g);
 box(2.2,.3,1.2,M.stone,0,.15,d/2+.7,g);

 scene.add(g);
 obstacles.push({x,z,w,d});

 for(const s of [-1,1]){
  box(.2,1,.2,M.wood,s*(w/2+1),.5,d/2+1,g);
  box(.2,1,.2,M.wood,s*(w/2+1),.5,-d/2-1,g);
 }
}

let hid=0;
for(let x=-3;x<=3;x++){
 for(let z=-3;z<=3;z++){
  if(Math.abs(x)<1&&Math.abs(z)<1)continue;
  if(Math.random()>.72)continue;
  house(x*26+11,z*26+11,hid++);
 }
}

// TREES
const trees=[];
function tree(x,z,s){
 const g=new THREE.Group();
 const t=new THREE.Mesh(
  new THREE.CylinderGeometry(.35*s,.55*s,4*s,8),M.trunk
 );
 t.position.y=2*s;
 t.castShadow=true;
 g.add(t);

 for(let i=0;i<3;i++){
  const l=new THREE.Mesh(
   new THREE.ConeGeometry((3-i*.4)*s,5*s,8),
   i===1?M.leaf2:M.leaf
  );
  l.position.y=(4.5+i*1.5)*s;
  l.castShadow=true;
  g.add(l);
 }
 g.position.set(x,0,z);
 scene.add(g);
 trees.push({x,z,r:1.5*s});
}

for(let i=0;i<150;i++){
 const x=(Math.random()-.5)*240;
 const z=(Math.random()-.5)*240;
 if(Math.abs(x)<18||Math.abs(z)<18)continue;
 tree(x,z,.7+Math.random()*.8);
}

// HILLS
for(let i=0;i<16;i++){
 const h=new THREE.Mesh(
  new THREE.SphereGeometry(1,16,12),M.grass
 );
 const s=12+Math.random()*20;
 h.scale.set(s,s*.7,s);
 h.position.set((Math.random()-.5)*270,-5,(Math.random()-.5)*270);
 scene.add(h);
}

// LAKE
const lake=new THREE.Mesh(
 new THREE.CircleGeometry(15,48),
 new THREE.MeshStandardMaterial({
  color:0x17465a,roughness:.2,metalness:.3
 })
);
lake.rotation.x=-Math.PI/2;
lake.position.set(45,-.08,-65);
scene.add(lake);

// ROCKS
for(let i=0;i<170;i++){
 const r=new THREE.Mesh(
  new THREE.DodecahedronGeometry(.3+Math.random()*.8),M.stone
 );
 r.position.set((Math.random()-.5)*220,.1,(Math.random()-.5)*220);
 r.scale.y=.6;
 scene.add(r);
}

// STREET LAMPS
for(let i=-4;i<=4;i++){
 for(const s of [-1,1]){
  const x=s*9,z=i*28;
  const p=new THREE.Mesh(
   new THREE.CylinderGeometry(.09,.14,5,8),M.wood
  );
  p.position.set(x,2.5,z);
  scene.add(p);

  const bulb=new THREE.Mesh(
   new THREE.SphereGeometry(.3,12,12),
   new THREE.MeshBasicMaterial({color:0xffd27c})
  );
  bulb.position.set(x,5,z);
  scene.add(bulb);

  const l=new THREE.PointLight(0xffc46b,1.3,17);
  l.position.set(x,4.7,z);
  scene.add(l);
 }
}

// PLAYER
const player=new THREE.Group();
scene.add(player);

box(.9,1.1,.48,M.shirt,0,1.4,0,player);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.3,18,16),M.skin
);
head.position.y=2.18;
player.add(head);

const hair=new THREE.Mesh(
 new THREE.SphereGeometry(.31,16,10,0,Math.PI*2,0,Math.PI*.48),
 M.dark
);
hair.position.y=2.31;
player.add(hair);

const arms=[],legs=[];
for(const s of [-1,1]){
 const a=new THREE.Mesh(
  new THREE.CapsuleGeometry(.13,.58,4,8),M.shirt
 );
 a.position.set(s*.58,1.45,0);
 player.add(a);
 arms.push(a);

 const l=new THREE.Mesh(
  new THREE.CapsuleGeometry(.16,.65,4,8),M.pants
 );
 l.position.set(s*.23,.55,0);
 player.add(l);
 legs.push(l);

 box(.34,.2,.5,M.dark,s*.23,.13,.08,player);
}
box(.65,.75,.3,M.wood,0,1.45,.4,player);

// CREATURES
const creatures=[];
function creature(type,x,z){
 const g=new THREE.Group();
 const zombie=type==='zombie';
 const fur=mat(zombie?0x71806b:0x987451);
 const dark=mat(0x443329);

 if(zombie){
  box(.8,1.2,.45,fur,0,1.25,0,g);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.33,12,12),fur);
  h.position.y=2.08;
  g.add(h);
  for(const s of [-1,1]){
   box(.18,.85,.2,fur,s*.52,1.35,0,g);
   box(.23,.75,.23,dark,s*.22,.38,0,g);
  }
 }else{
  box(1.3,.75,.55,fur,0,1,0,g);
  box(.3,.75,.3,fur,0,1.45,-.38,g);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),fur);
  h.position.set(0,1.95,-.52);
  g.add(h);
  for(const s of [-1,1]){
   for(const zz of [-1,1]){
    const l=new THREE.Mesh(
     new THREE.CylinderGeometry(.07,.09,.65,6),dark
    );
    l.position.set(s*.4,.35,zz*.17);
    g.add(l);
   }
  }
 }

 g.position.set(x,0,z);
 scene.add(g);
 creatures.push({
  g,type,hp:100,
  direction:Math.random()*6
 });
}
for(let i=0;i<16;i++){
 creature(i<8?'animal':'zombie',
 (Math.random()-.5)*150,
 (Math.random()-.5)*150);
}

// CRYSTALS
const crystals=[];
for(let i=0;i<5;i++){
 const gem=new THREE.Mesh(
  new THREE.OctahedronGeometry(.8),
  new THREE.MeshStandardMaterial({
   color:0x00eeff,emissive:0x00baff,emissiveIntensity:2
  })
 );
 gem.position.set((i-2)*23,1.5,i%2?35:-35);
 scene.add(gem);
 crystals.push(gem);
}

// CAMPFIRE
const fire=new THREE.Mesh(
 new THREE.ConeGeometry(.7,2,10),
 new THREE.MeshBasicMaterial({color:0xff8a24})
);
fire.position.set(18,1.3,15);
scene.add(fire);
const fireLight=new THREE.PointLight(0xff762a,4,25);
fireLight.position.set(18,2,15);
scene.add(fireLight);

// DUST
const dust=[];
for(let i=0;i<300;i++){
 dust.push((Math.random()-.5)*180,Math.random()*30,(Math.random()-.5)*180);
}
const dg=new THREE.BufferGeometry();
dg.setAttribute('position',new THREE.Float32BufferAttribute(dust,3));
const particles=new THREE.Points(dg,new THREE.PointsMaterial({
 color:0xc1d9dd,size:.13,transparent:true,opacity:.5
}));
scene.add(particles);

// AUDIO
let audioCtx;
function startMusic(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.frequency.value=48;
 g.gain.value=.025;
 o.connect(g);
 g.connect(audioCtx.destination);
 o.start();
}
function sound(freq,duration=.16){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.frequency.value=freq;
 g.gain.setValueAtTime(.09,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 o.connect(g);
 g.connect(audioCtx.destination);
 o.start();
 o.stop(audioCtx.currentTime+duration);
}

// STATE
let started=false,health=100,score=0,selected=1,yaw=0;
let cooldown=0,damageCooldown=0,joyX=0,joyY=0;
let elapsed=0;
const keys={};
const projectiles=[];
const msg=document.getElementById('message');

function notify(t){
 msg.textContent=t;
 setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},1800);
}

function healthSet(v){
 health=Math.max(0,Math.min(100,v));
 document.getElementById('health').textContent=Math.round(health);
 document.getElementById('healthfill').style.width=health+'%';
 if(health<=0){
  started=false;
  document.getElementById('start').style.display='flex';
  document.querySelector('#start h1').textContent='GAME OVER';
  document.querySelector('#start h3').textContent='THE NIGHT HAS WON';
  document.getElementById('play').textContent='RESTART';
 }
}

function resetGame(){
 health=100;score=0;
 player.position.set(0,0,0);
 crystals.forEach(g=>g.visible=true);
 creatures.forEach(c=>{
  c.g.visible=true;c.hp=100;
 });
 document.getElementById('score').textContent='0/5';
 document.getElementById('mission').textContent='MISSION: Explore the village';
 healthSet(100);
}

document.getElementById('play').onclick=()=>{
 if(health<=0)resetGame();
 started=true;
 document.getElementById('start').style.display='none';
 startMusic();
 notify('Welcome to Lost City!');
};

// WEAPONS
function selectWeapon(n){
 selected=n;
 document.querySelectorAll('.weapon').forEach(b=>{
  b.classList.toggle('active',Number(b.dataset.id)===n);
 });
 camera.fov=n===3?38:65;
 camera.updateProjectionMatrix();
}
document.querySelectorAll('.weapon').forEach(b=>{
 b.onclick=()=>selectWeapon(Number(b.dataset.id));
});

function useAction(){
 if(!started||cooldown>0)return;
 cooldown=.45;

 if(selected===3){
  notify('Scope view enabled');
  return;
 }

 if(selected===5){
  creatures.forEach(c=>{
   if(c.g.visible&&c.g.position.distanceTo(player.position)<3){
    c.hp-=45;
    if(c.hp<=0){c.g.visible=false;scene.remove(c.g)}
   }
  });
  notify('Sword activated!');
  return;
 }

 const orb=new THREE.Mesh(
  new THREE.SphereGeometry(selected===4?.8:.22,12,12),
  new THREE.MeshBasicMaterial({color:selected===4?0xffc34d:0x00eaff})
 );
 orb.position.copy(player.position);
 orb.position.y=1.4;
 const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 scene.add(orb);
 projectiles.push({orb,dir,life:1.8,damage:selected===4?55:30});
 sound(440,.12);
 notify('Energy pulse released!');
}

document.getElementById('action').onclick=useAction;
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if('123456'.includes(e.key))selectWeapon(Number(e.key));
 if(e.code==='Space')useAction();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// JOYSTICK
const joy=document.getElementById('joy');
const stick=document.getElementById('stick');
joy.addEventListener('pointerdown',e=>joy.setPointerCapture(e.pointerId));
joy.addEventListener('pointermove',e=>{
 if(!joy.hasPointerCapture(e.pointerId))return;
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const len=Math.hypot(x,y),max=32;
 if(len>max){x=x/len*max;y=y/len*max}
 joyX=x/max;joyY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
});
function resetJoy(){
 joyX=joyY=0;
 stick.style.transform='translate(0,0)';
}
joy.addEventListener('pointerup',resetJoy);
joy.addEventListener('pointercancel',resetJoy);

// CAMERA LOOK
let looking=false,lastX=0;
const look=document.getElementById('look');
look.addEventListener('pointerdown',e=>{
 look.setPointerCapture(e.pointerId);
 looking=true;lastX=e.clientX;
});
look.addEventListener('pointermove',e=>{
 if(!looking)return;
 yaw-=(e.clientX-lastX)*.009;
 lastX=e.clientX;
});
look.addEventListener('pointerup',()=>looking=false);
look.addEventListener('pointercancel',()=>looking=false);

// RUN
const run=document.getElementById('run');
run.onpointerdown=()=>keys.shift=true;
run.onpointerup=()=>keys.shift=false;
run.onpointercancel=()=>keys.shift=false;

// COLLISION
function blocked(x,z){
 for(const h of obstacles){
  if(Math.abs(x-h.x)<h.w/2+1&&Math.abs(z-h.z)<h.d/2+1)return true;
 }
 for(const t of trees){
  if(Math.hypot(x-t.x,z-t.z)<t.r+.6)return true;
 }
 return false;
}

// MAIN LOOP
const clock=new THREE.Clock();
const target=new THREE.Vector3();
const forward=new THREE.Vector3();
const right=new THREE.Vector3();
const move=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;
 cooldown=Math.max(0,cooldown-dt);
 damageCooldown=Math.max(0,damageCooldown-dt);

 fire.scale.setScalar(1+Math.sin(elapsed*12)*.12);
 particles.rotation.y+=dt*.008;

 if(started){
  let f=0,s=0;
  if(keys.w||keys.arrowup)f++;
  if(keys.s||keys.arrowdown)f--;
  if(keys.a||keys.arrowleft)s--;
  if(keys.d||keys.arrowright)s++;
  f-=joyY;s+=joyX;
  const len=Math.hypot(f,s);
  if(len>1){f/=len;s/=len}

  const moving=len>.05;
  const speed=(keys.shift?12:6.5)*dt;
  forward.set(-Math.sin(yaw),0,-Math.cos(yaw));
  right.set(Math.cos(yaw),0,-Math.sin(yaw));
  move.copy(forward).multiplyScalar(f);
  move.addScaledVector(right,s);

  const nx=player.position.x+move.x*speed;
  const nz=player.position.z+move.z*speed;
  if(!blocked(nx,player.position.z))player.position.x=nx;
  if(!blocked(player.position.x,nz))player.position.z=nz;

  player.position.x=THREE.MathUtils.clamp(player.position.x,-120,120);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-120,120);

  if(moving){
   player.rotation.y=Math.atan2(move.x,move.z);
   const swing=Math.sin(elapsed*11)*.65;
   arms[0].rotation.x=swing;
   arms[1].rotation.x=-swing;
   legs[0].rotation.x=-swing;
   legs[1].rotation.x=swing;
  }else{
   arms.forEach(a=>a.rotation.x=0);
   legs.forEach(a=>a.rotation.x=0);
  }

  // CREATURE AI
  creatures.forEach(c=>{
   if(!c.g.visible)return;
   const diff=player.position.clone().sub(c.g.position);
   const dist=diff.length();

   if(c.type==='zombie'){
    if(dist>2.2){
     diff.normalize();
     c.g.position.addScaledVector(diff,1.2*dt);
     c.g.rotation.y=Math.atan2(diff.x,diff.z);
    }else if(damageCooldown<=0){
     healthSet(health-10);
     damageCooldown=1;
     notify('Creature nearby!');
    }
   }else{
    if(Math.random()<.01)c.direction=Math.random()*Math.PI*2;
    if(dist<5)c.direction=Math.atan2(
     c.g.position.x-player.position.x,
     c.g.position.z-player.position.z
    );
    c.g.position.x+=Math.sin(c.direction)*.7*dt;
    c.g.position.z+=Math.cos(c.direction)*.7*dt;
   }
  });

  // PROJECTILES
  for(let i=projectiles.length-1;i>=0;i--){
   const p=projectiles[i];
   p.orb.position.addScaledVector(p.dir,28*dt);
   p.life-=dt;

   creatures.forEach(c=>{
    if(c.g.visible&&p.orb.position.distanceTo(
     c.g.position.clone().add(new THREE.Vector3(0,1,0))
    )<2){
     c.hp-=p.damage;
     if(c.hp<=0){
      c.g.visible=false;
      scene.remove(c.g);
      notify('Creature defeated!');
     }
     p.life=0;
    }
   });

   if(p.life<=0){
    scene.remove(p.orb);
    projectiles.splice(i,1);
   }
  }

  // CRYSTALS
  crystals.forEach(g=>{
   if(!g.visible)return;
   g.rotation.y+=dt*1.8;
   g.position.y=1.5+Math.sin(elapsed*2)*.2;
   if(g.position.distanceTo(player.position)<2.5){
    g.visible=false;
    score++;
    document.getElementById('score').textContent=score+'/5';
    sound(650,.3);
    notify('Crystal collected!');
    if(score===5){
     document.getElementById('mission').textContent='MISSION COMPLETE!';
     notify('ALL CRYSTALS FOUND!');
    }
   }
  });

  // CAMERA
  target.set(   player.position.x+Math.sin(yaw)*8,
   player.position.y+4.5,
   player.position.z+Math.cos(yaw)*8
  );

  camera.position.lerp(target,.09);
  camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);

  document.getElementById('enemycount').textContent =
   creatures.filter(c=>c.g.visible&&c.type==='zombie').length;
 }

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
